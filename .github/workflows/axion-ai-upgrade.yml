name: Axion AI Auto-Upgrade

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-upgrade:
    if: startsWith(github.event.issue.title, '[UPGRADE]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run AI Upgrader & Syntax Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: python scripts/ai_upgrader.py

      - name: Create Branch & Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="ai-upgrade-issue-${ISSUE_NUM}"
          git config user.name "Axion AI Bot"
          git config user.email "bot@axion.local"
          git checkout -B "$BRANCH"
          git add app.py
          git commit -m "AI Upgrade: ${ISSUE_TITLE} (#${ISSUE_NUM})"
          git push -f origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "🤖 ${ISSUE_TITLE}" \
            --body "อัปเกรดอัตโนมัติจาก Issue #${ISSUE_NUM} (ผ่านการตรวจ Syntax แล้ว)" \
            --base main \
            --head "$BRANCH")
          PR_NUM=$(basename "$PR_URL")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_num=$PR_NUM" >> $GITHUB_OUTPUT

      - name: Notify LINE & Discord for Approval
        env:
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          PR_NUM: ${{ steps.create_pr.outputs.pr_num }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_UID: ${{ secrets.LINE_USER_ID }}
          DISCORD_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - << 'EOF'
          import os, requests

          pr_url = os.getenv("PR_URL", "")
          pr_num = os.getenv("PR_NUM", "")
          title = os.getenv("ISSUE_TITLE", "")
          line_token = os.getenv("LINE_TOKEN", "")
          line_uid = os.getenv("LINE_UID", "")
          discord_url = os.getenv("DISCORD_URL", "")

          summary = ""
          if os.path.exists("upgrade_summary.txt"):
              with open("upgrade_summary.txt", "r", encoding="utf-8") as f:
                  summary = f.read().strip()

          msg = (
              f"🛠️ AXION AI UPGRADE รออนุมัติ (PR #{pr_num})\n"
              f"รายการ: {title}\n"
              f"สถานะ: เช็ค Syntax ผ่านแล้ว ✅\n"
              f"━━━━━━━━━━━━━━\n"
              f"{summary}\n"
              f"━━━━━━━━━━━━━━\n"
              f"👉 พิมพ์คำสั่งนี้ในแชทเพื่ออนุมัติทันที:\n"
              f"/merge {pr_num}\n\n"
              f"🔎 ดูโค้ดเต็ม:\n{pr_url}"
          )[:4800]

          if line_token and line_uid:
              res = requests.post(
                  "https://api.line.me/v2/bot/message/push",
                  headers={"Authorization": f"Bearer {line_token}", "Content-Type": "application/json"},
                  json={"to": line_uid, "messages": [{"type": "text", "text": msg}]}
              )
              print("LINE status:", res.status_code, res.text)

          if discord_url:
              res = requests.post(discord_url, json={"content": msg[:1900]})
              print("Discord status:", res.status_code)
          EOF
